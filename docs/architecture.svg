    <rect x="764.5" y="548.5" width="120" height="22" rx="11" fill="#f5f5f4" stroke="#d6d3d1"/>
    <text x="824.5" y="564" class="badge" fill="#44403c">No Meta model</text>
    <text x="824.5" y="594.1" class="title" fill="#1d1d1b">Phone notification</text>
    <text x="824.5" y="619.3" class="model" fill="#57534e">Installed app; tap</text>
    <text x="824.5" y="638.3" class="model" fill="#57534e">opens the alert</text>
  </g>
  <rect x="20" y="700" width="920" height="193" rx="16" fill="#f7f5f2" stroke="#e2dcd2" stroke-width="1.5"/>
  <text x="480" y="734.72" class="lane-title">Recovery</text>
