  <rect x="20" y="909" width="920" height="197" rx="16" fill="#fffdf8" stroke="#78716c" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text x="480" y="943.72" class="lane-title">Evaluation only (not in the live product)</text>
  <text x="480" y="968.6" class="note">Used offline to test our alerts. It is not connected to the live alert path.</text>
  <g class="node" data-id="wonder-review">
    <rect x="368" y="987" width="225" height="99" rx="10" fill="#fff1e3" stroke="#ea580c" stroke-width="2"/>
    <rect x="431.5" y="999" width="98" height="22" rx="11" fill="#ffffff" stroke="#f4c79a"/>
