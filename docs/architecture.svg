    <rect x="537" y="314" width="138" height="99" rx="10" fill="#fff1e3" stroke="#ea580c" stroke-width="2"/>
    <rect x="557" y="326" width="98" height="22" rx="11" fill="#ffffff" stroke="#f4c79a"/>
    <text x="606" y="341.5" class="badge" fill="#7c2d12">Meta model</text>
    <text x="606" y="371.6" class="title" fill="#7c2d12">Ask: answer</text>
    <text x="606" y="396.8" class="model" fill="#9a3412">Muse Spark 1.3</text>
  </g>
  <rect x="20" y="449" width="920" height="193" rx="16" fill="#f7f5f2" stroke="#e2dcd2" stroke-width="1.5"/>
