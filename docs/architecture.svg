    <rect x="743" y="525" width="98" height="22" rx="11" fill="#ffffff" stroke="#f4c79a"/>
    <text x="792" y="540.5" class="badge" fill="#7c2d12">Meta model</text>
    <text x="792" y="570.6" class="title" fill="#7c2d12">Report</text>
    <text x="792" y="595.8" class="model" fill="#9a3412">Muse Spark 1.3</text>
  </g>
  <rect x="20" y="658" width="920" height="197" rx="16" fill="#fffdf8" stroke="#78716c" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text x="480" y="692.72" class="lane-title">Evaluation only (not in the live product)</text>
  <text x="480" y="717.6" class="note">Used offline to test our alerts. It is not connected to the live alert path.</text>
  <g class="node" data-id="wonder-review">
