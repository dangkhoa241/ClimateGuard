    <rect x="537" y="314" width="138" height="99" rx="10" fill="#fff1e3" stroke="#ea580c" stroke-width="2"/>
    <rect x="557" y="326" width="98" height="22" rx="11" fill="#ffffff" stroke="#f4c79a"/>
    <text x="606" y="341.5" class="badge" fill="#7c2d12">Meta model</text>
    <text x="606" y="371.6" class="title" fill="#7c2d12">Ask: answer</text>
    <text x="606" y="396.8" class="model" fill="#9a3412">Muse Spark 1.3</text>
  </g>
  <rect x="20" y="449" width="920" height="235" rx="16" fill="#f7f5f2" stroke="#e2dcd2" stroke-width="1.5"/>
  <text x="480" y="483.72" class="lane-title">Alert delivery</text>
  <text x="480" y="508.6" class="note">Every email is published before any push starts. Push has a 20-second budget and never blocks or delays email.</text>
  <g class="node" data-id="deliver-email">
    <rect x="49" y="527" width="196" height="137" rx="10" fill="#ffffff" stroke="#a8a29e" stroke-width="2"/>
    <rect x="87" y="548.5" width="120" height="22" rx="11" fill="#f5f5f4" stroke="#d6d3d1"/>
    <text x="147" y="564" class="badge" fill="#44403c">No Meta model</text>
    <text x="147" y="594.1" class="title" fill="#1d1d1b">Email first</text>
    <text x="147" y="619.3" class="model" fill="#57534e">Amazon SNS, one topic</text>
    <text x="147" y="638.3" class="model" fill="#57534e">per zone + language</text>
  </g>
  <path class="arrow" d="M250 595.5H273" fill="none" stroke="#57534e" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <g class="node" data-id="deliver-push">
    <rect x="279" y="527" width="199" height="137" rx="10" fill="#ffffff" stroke="#a8a29e" stroke-width="2"/>
    <rect x="318.5" y="539" width="120" height="22" rx="11" fill="#f5f5f4" stroke="#d6d3d1"/>
    <text x="378.5" y="554.5" class="badge" fill="#44403c">No Meta model</text>
    <text x="378.5" y="584.6" class="title" fill="#1d1d1b">Then web push</text>
    <text x="378.5" y="609.8" class="model" fill="#57534e">Subscriptions in</text>
    <text x="378.5" y="628.8" class="model" fill="#57534e">DynamoDB; VAPID key</text>
    <text x="378.5" y="647.8" class="model" fill="#57534e">in SSM</text>
  </g>
  <path class="arrow" d="M483 595.5H506" fill="none" stroke="#57534e" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <g class="node" data-id="deliver-services">
    <rect x="512" y="527" width="191" height="137" rx="10" fill="#ffffff" stroke="#a8a29e" stroke-width="2"/>
    <rect x="547.5" y="548.5" width="120" height="22" rx="11" fill="#f5f5f4" stroke="#d6d3d1"/>
