    <text x="607.5" y="594.1" class="title" fill="#1d1d1b">Push services</text>
    <text x="607.5" y="619.3" class="model" fill="#57534e">Google, Apple, Mozilla,</text>
    <text x="607.5" y="638.3" class="model" fill="#57534e">Microsoft</text>
  </g>
  <path class="arrow" d="M708 595.5H731" fill="none" stroke="#57534e" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowhead)"/>
