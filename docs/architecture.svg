    <text x="842" y="205.1" class="title" fill="#1d1d1b">read-aloud</text>
    <text x="842" y="230.3" class="model" fill="#57534e">Device voice</text>
  </g>
  <text x="480" y="303.16" class="flow-title">Ask</text>
  <g class="node" data-id="ask-transcribe">
    <rect x="286" y="314" width="217" height="99" rx="10" fill="#fff1e3" stroke="#ea580c" stroke-width="2"/>
    <rect x="345.5" y="326" width="98" height="22" rx="11" fill="#ffffff" stroke="#f4c79a"/>
