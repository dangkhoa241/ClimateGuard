    <text x="368.5" y="846.8" class="model" fill="#9a3412">SAM 3.1</text>
  </g>
  <path class="arrow" d="M455 813.5H478" fill="none" stroke="#57534e" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowhead)"/>
