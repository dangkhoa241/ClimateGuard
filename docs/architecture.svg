<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 875" width="960" height="875" role="img" aria-labelledby="title description">
  <title id="title">Alert, Ask, and recovery workflow diagram</title>
  <desc id="description">Alerts: NWS data, alert decision, safety rules, translation and read-aloud; Ask: voice transcription and answer. Recovery: photos, SAM outlines, image analysis and report. Evaluation only (not in the live product): Muse Wonder 1.0 review, not connected to the live path.</desc>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#57534e"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; text-anchor: middle; }
    .legend { font-size: 15px; fill: #1d1d1b; text-anchor: start; }
    .lane-title { font-size: 19px; font-weight: 700; fill: #1d1d1b; }
    .flow-title { font-size: 17px; font-weight: 700; fill: #1d1d1b; }
    .note { font-size: 15px; fill: #57534e; }
    .badge { font-size: 13px; font-weight: 700; }
    .title { font-size: 16px; font-weight: 700; }
    .model { font-size: 15px; font-weight: 500; }
  </style>
  <rect x="1" y="1" width="958" height="873" rx="20" fill="#fffdf8" stroke="#e7e1d6" stroke-width="2"/>
  <rect x="254.8" y="20" width="22" height="16" rx="4" fill="#fff1e3" stroke="#ea580c" stroke-width="2"/>
  <text x="284.8" y="33" class="legend">Meta model</text>
  <rect x="397.5" y="20" width="22" height="16" rx="4" fill="#ffffff" stroke="#a8a29e" stroke-width="2"/>
  <text x="427.5" y="33" class="legend">No Meta model</text>
  <rect x="565.3" y="20" width="22" height="16" rx="4" fill="#fffdf8" stroke="#78716c" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="595.3" y="33" class="legend">Evaluation only</text>
  <rect x="20" y="54" width="920" height="379" rx="16" fill="#f7f5f2" stroke="#e2dcd2" stroke-width="1.5"/>
  <text x="480" y="88.72" class="lane-title">Alerts</text>
  <g class="node" data-id="nws">
    <rect x="47" y="108" width="150" height="158" rx="10" fill="#ffffff" stroke="#a8a29e" stroke-width="2"/>
    <rect x="62" y="120" width="120" height="22" rx="11" fill="#f5f5f4" stroke="#d6d3d1"/>
    <text x="122" y="135.5" class="badge" fill="#44403c">No Meta model</text>
    <text x="122" y="165.6" class="title" fill="#1d1d1b">NWS data,</text>
    <text x="122" y="185.6" class="title" fill="#1d1d1b">every 15</text>
    <text x="122" y="205.6" class="title" fill="#1d1d1b">minutes</text>
    <text x="122" y="230.8" class="model" fill="#57534e">National Weather</text>
    <text x="122" y="249.8" class="model" fill="#57534e">Service</text>
  </g>
  <path class="arrow" d="M202 187H225" fill="none" stroke="#57534e" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <g class="node" data-id="decision">
