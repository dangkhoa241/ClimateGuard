  <g class="node" data-id="recovery-photos">
    <rect x="99" y="503" width="154" height="119" rx="10" fill="#ffffff" stroke="#a8a29e" stroke-width="2"/>
    <rect x="116" y="537.5" width="120" height="22" rx="11" fill="#f5f5f4" stroke="#d6d3d1"/>
    <text x="176" y="553" class="badge" fill="#44403c">No Meta model</text>
    <text x="176" y="583.1" class="title" fill="#1d1d1b">Damage photos</text>
  </g>
  <path class="arrow" d="M258 562.5H281" fill="none" stroke="#57534e" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <g class="node" data-id="sam">
    <rect x="287" y="503" width="163" height="119" rx="10" fill="#fff1e3" stroke="#ea580c" stroke-width="2"/>
    <rect x="319.5" y="525" width="98" height="22" rx="11" fill="#ffffff" stroke="#f4c79a"/>
    <text x="368.5" y="540.5" class="badge" fill="#7c2d12">Meta model</text>
    <text x="368.5" y="570.6" class="title" fill="#7c2d12">SAM 3.1 outlines</text>
    <text x="368.5" y="595.8" class="model" fill="#9a3412">SAM 3.1</text>
  </g>
  <path class="arrow" d="M455 562.5H478" fill="none" stroke="#57534e" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <g class="node" data-id="image-analysis">
    <rect x="484" y="503" width="205" height="119" rx="10" fill="#fff1e3" stroke="#ea580c" stroke-width="2"/>
    <rect x="537.5" y="515" width="98" height="22" rx="11" fill="#ffffff" stroke="#f4c79a"/>
    <text x="586.5" y="530.5" class="badge" fill="#7c2d12">Meta model</text>
    <text x="586.5" y="560.6" class="title" fill="#7c2d12">Muse Spark 1.3 image</text>
    <text x="586.5" y="580.6" class="title" fill="#7c2d12">analysis</text>
    <text x="586.5" y="605.8" class="model" fill="#9a3412">Muse Spark 1.3</text>
  </g>
  <path class="arrow" d="M694 562.5H717" fill="none" stroke="#57534e" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <g class="node" data-id="report">
