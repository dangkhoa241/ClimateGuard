    <rect x="116" y="788.5" width="120" height="22" rx="11" fill="#f5f5f4" stroke="#d6d3d1"/>
    <text x="176" y="804" class="badge" fill="#44403c">No Meta model</text>
    <text x="176" y="834.1" class="title" fill="#1d1d1b">Damage photos</text>
  </g>
  <path class="arrow" d="M258 813.5H281" fill="none" stroke="#57534e" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowhead)"/>
