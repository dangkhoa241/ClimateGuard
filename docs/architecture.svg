    <rect x="770" y="108" width="144" height="158" rx="10" fill="#ffffff" stroke="#a8a29e" stroke-width="2"/>
    <rect x="782" y="139.5" width="120" height="22" rx="11" fill="#f5f5f4" stroke="#d6d3d1"/>
    <text x="842" y="155" class="badge" fill="#44403c">No Meta model</text>
