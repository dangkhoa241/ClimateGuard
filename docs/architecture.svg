    <text x="308.5" y="210.8" class="model" fill="#9a3412">Muse Spark Open</text>
    <text x="308.5" y="229.8" class="model" fill="#9a3412">(Baseten)</text>
  </g>
  <path class="arrow" d="M391 187H414" fill="none" stroke="#57534e" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowhead)"/>
