    <text x="394.5" y="371.6" class="title" fill="#7c2d12">Ask: speech to text</text>
    <text x="394.5" y="396.8" class="model" fill="#9a3412">Muse Voice Transcribe 1.0</text>
  </g>
  <path class="arrow" d="M508 363.5H531" fill="none" stroke="#57534e" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowhead)"/>
