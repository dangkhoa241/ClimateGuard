    <rect x="618" y="149.5" width="98" height="22" rx="11" fill="#ffffff" stroke="#f4c79a"/>
    <text x="667" y="165" class="badge" fill="#7c2d12">Meta model</text>
    <text x="667" y="195.1" class="title" fill="#7c2d12">Translation</text>
    <text x="667" y="220.3" class="model" fill="#9a3412">Muse Spark 1.3</text>
  </g>
  <path class="arrow" d="M741 187H764" fill="none" stroke="#57534e" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowhead)"/>
