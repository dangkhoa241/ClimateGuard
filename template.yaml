AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  ClimateGuard backend (us-east-2; the account's SCP denies other regions). Deploy with `sam build`
  then `.\deploy.ps1`, which runs a permission preflight first. API keys live in SSM Parameter Store.

Parameters:
  FrontendUrl:
    Type: String
    Description: >-
      Public URL of the frontend (CORS origin and links in alert emails), no trailing slash.
      Use http://localhost:5173 until the Vercel app exists, then redeploy with the real URL.
  LocalDevOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Vite dev server origin, allowed by CORS in addition to FrontendUrl
  LocalDevOrigin2:
    Type: String
    Default: http://localhost:5174
    Description: Second Vite dev server origin (when 5173 is taken by another project)
  MaxSubscribers:
    Type: Number
    Default: 500
  MaxSubscriptionsPerEmail:
    Type: Number
    Default: 3
    Description: Maximum distinct zone and language subscriptions per email in one year.
  DailyModelBudgetUsd:
    Type: Number
    Default: 3
    Description: Maximum estimated model spend per UTC day.
  NwsUserAgent:
    Type: String
    Description: NWS asks for a User-Agent with contact info, e.g. "ClimateGuard/0.1 you@example.com"

Conditions:
  FrontendIsLocalDev: !Or [!Equals [!Ref FrontendUrl, !Ref LocalDevOrigin], !Equals [!Ref FrontendUrl, !Ref LocalDevOrigin2]]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    CodeUri: backend/src/
    MemorySize: 256
    Environment:
      Variables:
        STORAGE: dynamodb
        SNAPSHOTS_TABLE: !Ref SnapshotsTable
        USAGE_TABLE: !Ref UsageTable
        CACHE_TABLE: !Ref CacheTable
        ALERTS_TABLE: !Ref AlertsTable
        RATELIMIT_TABLE: !Ref RateLimitTable
        ZONES_TABLE: !Ref ZonesTable
        RECOVERY_BUCKET: !Ref RecoveryBucket
        NOTIFY_MODE: sns
        FRONTEND_URL: !Ref FrontendUrl
        MAX_SUBSCRIBERS: !Ref MaxSubscribers
        MAX_SUBSCRIPTIONS_PER_EMAIL: !Ref MaxSubscriptionsPerEmail
        DAILY_MODEL_BUDGET_USD: !Ref DailyModelBudgetUsd
        CG_LOCAL_DIR: /tmp/climateguard
        NWS_USER_AGENT: !Ref NwsUserAgent

Resources:
  SnapshotsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: climateguard-snapshots
      BillingMode: PROVISIONED  # free tier: 25 RCU / 25 WCU total across tables
      ProvisionedThroughput: { ReadCapacityUnits: 5, WriteCapacityUnits: 5 }
      AttributeDefinitions:
        - { AttributeName: zone, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: zone, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }

  # Model usage + estimated cost per call (scripts/spend.py reads it with STORAGE=dynamodb)
  UsageTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: climateguard-usage
      BillingMode: PROVISIONED
      ProvisionedThroughput: { ReadCapacityUnits: 2, WriteCapacityUnits: 2 }
      AttributeDefinitions:
        - { AttributeName: day, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: day, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }

  # Model response cache; DynamoDB TTL removes expired items
  CacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: climateguard-cache
      BillingMode: PROVISIONED
      ProvisionedThroughput: { ReadCapacityUnits: 2, WriteCapacityUnits: 2 }
      AttributeDefinitions:
        - { AttributeName: key, AttributeType: S }
      KeySchema:
        - { AttributeName: key, KeyType: HASH }
      TimeToLiveSpecification: { AttributeName: expires_at, Enabled: true }

  # Sent alerts (dedup) + monitoring agent decision log
  AlertsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: climateguard-alerts
      BillingMode: PROVISIONED
      ProvisionedThroughput: { ReadCapacityUnits: 2, WriteCapacityUnits: 2 }
      AttributeDefinitions:
        - { AttributeName: zone, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: zone, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }

  # NWS forecast zones: name, timezone, sign-up languages, confirmed-subscriber counts
  ZonesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: climateguard-zones
      BillingMode: PROVISIONED
      ProvisionedThroughput: { ReadCapacityUnits: 2, WriteCapacityUnits: 2 }
      AttributeDefinitions:
        - { AttributeName: zone, AttributeType: S }
      KeySchema:
        - { AttributeName: zone, KeyType: HASH }

  # Sign-up limits, subscription caps, and the UTC daily model-spend reservation counter
  RateLimitTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: climateguard-ratelimit
      BillingMode: PROVISIONED
      ProvisionedThroughput: { ReadCapacityUnits: 2, WriteCapacityUnits: 5 }
      AttributeDefinitions:
        - { AttributeName: k, AttributeType: S }
      KeySchema:
        - { AttributeName: k, KeyType: HASH }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }

  # Recovery photos + job records. Private, deleted after 24 hours by the collector (recovery_store.py);
  # the lifecycle rule is a backstop (S3 runs it once a day).
  RecoveryBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub climateguard-recovery-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: expire-after-1-day
            Status: Enabled
            ExpirationInDays: 1
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }

  # 7-day retention keeps logs well inside the free 5 GB (Lambda's default groups never expire)
  CollectLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /climateguard/collect
      RetentionInDays: 7

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /climateguard/api
      RetentionInDays: 7

  CollectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: climateguard.handlers.collect.handler
      # Zones are collected in parallel; agent runs (~10-20 s each) only for changed zones, 4 at a time
      Timeout: 600
      MemorySize: 512
      LoggingConfig: { LogGroup: !Ref CollectLogGroup }
      Environment:
        Variables:
          # SecureStrings created by hand (CloudFormation can't create them); see README "Deploy".
          # The code reads BASETEN_API_KEY / AIRNOW_API_KEY env vars first, then these parameters.
          BASETEN_API_KEY_PARAM: /climateguard/baseten-api-key
          AIRNOW_API_KEY_PARAM: /climateguard/airnow-api-key  # if missing: Open-Meteo modeled AQI
          # Muse Spark 1.3 translates alerts for zh/tl/ko/ar sign-ups; if missing: English with a note
          MODEL_API_KEY_PARAM: /climateguard/meta-model-api-key
          USE_CONTRIBUTOR: "false"
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref SnapshotsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref UsageTable }
        - DynamoDBCrudPolicy: { TableName: !Ref CacheTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AlertsTable }
        # Decryption uses the AWS-managed aws/ssm key, whose key policy already allows SSM callers
        - SSMParameterReadPolicy: { ParameterName: climateguard/baseten-api-key }
        - SSMParameterReadPolicy: { ParameterName: climateguard/airnow-api-key }
        - SSMParameterReadPolicy: { ParameterName: climateguard/meta-model-api-key }
        - DynamoDBCrudPolicy: { TableName: !Ref ZonesTable }
        # daily counters for the public decision history (stats.py: k="stats#<day>"); without it every
        # run logged AccessDenied and the history showed zero checks
        - DynamoDBCrudPolicy: { TableName: !Ref RateLimitTable }
        - S3CrudPolicy: { BucketName: !Ref RecoveryBucket }  # deletes recovery photos older than 24 h
        - Statement:
            - Effect: Allow
              Action: [sns:CreateTopic, sns:Publish, sns:TagResource, sns:ListSubscriptionsByTopic]
              Resource: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:climateguard-*
      Events:
        Every15Min:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(15 minutes)

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # API Gateway rejects duplicate origins, so FrontendUrl is only added when it isn't a localhost origin
      # (deploy.ps1 also normalizes FrontendUrl and fails the preflight on duplicates). The !If wraps the
      # whole block: SAM mistranslates an !If placed on AllowOrigins alone (verified with samtranslator).
      CorsConfiguration: !If
        - FrontendIsLocalDev
        - AllowOrigins: [!Ref LocalDevOrigin, !Ref LocalDevOrigin2]
          AllowMethods: [GET, POST, DELETE, OPTIONS]
          AllowHeaders: [Content-Type]
        - AllowOrigins: [!Ref FrontendUrl, !Ref LocalDevOrigin, !Ref LocalDevOrigin2]
          AllowMethods: [GET, POST, DELETE, OPTIONS]
          AllowHeaders: [Content-Type]
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5
      RouteSettings:
        "POST /subscribe":
          ThrottlingBurstLimit: 1
          ThrottlingRateLimit: 0.2
        "POST /ask":
          ThrottlingBurstLimit: 2
          ThrottlingRateLimit: 0.5
        "POST /transcribe":
          ThrottlingBurstLimit: 2
          ThrottlingRateLimit: 0.5
        "POST /translate":
          ThrottlingBurstLimit: 2
          ThrottlingRateLimit: 0.5
        "POST /pretalk":
          ThrottlingBurstLimit: 2
          ThrottlingRateLimit: 0.5
        "POST /demo/replay":
          ThrottlingBurstLimit: 2
          ThrottlingRateLimit: 0.5
        "POST /recovery":
          ThrottlingBurstLimit: 1
          ThrottlingRateLimit: 0.2
        "POST /recovery/{job}/photos":
          ThrottlingBurstLimit: 2
          ThrottlingRateLimit: 1
        "POST /recovery/{job}/analyze":
          ThrottlingBurstLimit: 1
          ThrottlingRateLimit: 0.1
        "POST /recovery/{job}/answers":
          ThrottlingBurstLimit: 1
          ThrottlingRateLimit: 0.2

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: climateguard.handlers.api.handler
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref ApiLogGroup }
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref SnapshotsTable }
        - DynamoDBReadPolicy: { TableName: !Ref AlertsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref RateLimitTable }
        - Statement:
            - Effect: Allow
              Action: dynamodb:TransactWriteItems
              Resource: !GetAtt RateLimitTable.Arn
        - DynamoDBCrudPolicy: { TableName: !Ref ZonesTable }  # /locate registers new zones
        - DynamoDBReadPolicy: { TableName: !Ref UsageTable }  # GET /demo: real model cost so far + budget state
        - Statement:
            - Effect: Allow
              Action: [sns:CreateTopic, sns:Subscribe, sns:TagResource]
              Resource: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:climateguard-*
      Events:
        Locate:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /locate }
        Languages:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /languages }
        GetZone:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /zones/{zone}
        GetZoneAlerts:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /zones/{zone}/alerts
        Subscribe:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /subscribe }
        Decisions:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /decisions }
        Demo:  # demo mode: replay buttons, cost so far
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /demo }

  AskFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: climateguard.handlers.ask.handler
      # one model call with a 20 s deadline (ask.py), inside API Gateway's 30 s limit; a demo replay
      # waits at most 23 s for the agent, then shows the saved run (demo.py)
      Timeout: 28
      MemorySize: 512  # the OpenAI SDK import is slow at 256 MB
      LoggingConfig: { LogGroup: !Ref ApiLogGroup }
      Environment:
        Variables:
          MODEL_API_KEY_PARAM: /climateguard/meta-model-api-key
          AIRNOW_API_KEY_PARAM: /climateguard/airnow-api-key  # on-demand snapshots for unmonitored zones
          BASETEN_API_KEY_PARAM: /climateguard/baseten-api-key  # POST /demo/replay runs the monitoring agent
          USE_CONTRIBUTOR: "false"
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref SnapshotsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AlertsTable }  # demo replays log to DEMO-* keys (never live ones)
        - DynamoDBReadPolicy: { TableName: !Ref ZonesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref RateLimitTable }
        - DynamoDBCrudPolicy: { TableName: !Ref UsageTable }   # cost log + daily budget
        - DynamoDBCrudPolicy: { TableName: !Ref CacheTable }
        - SSMParameterReadPolicy: { ParameterName: climateguard/meta-model-api-key }
        - SSMParameterReadPolicy: { ParameterName: climateguard/airnow-api-key }
        - SSMParameterReadPolicy: { ParameterName: climateguard/baseten-api-key }
      Events:
        Ask:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /ask }
        Translate:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /translate }
        Transcribe:  # a spoken question (WAV) -> text, Muse Voice Transcribe
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /transcribe }
        PreTalk:  # supervisor view: today's crew checklist + AI pre-shift talk
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /pretalk }
        DemoReplay:  # demo mode: a real past event through the monitoring agent (never emailed)
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /demo/replay }

  # Recovery agent: routes + its own async worker (POST .../analyze re-invokes this function with
  # InvocationType=Event). Fixed name so the role can invoke itself without a circular reference.
  RecoveryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: climateguard-recovery
      Handler: climateguard.handlers.recovery.handler
      Timeout: 150      # the worker: one vision call (<= 60 s) + SAM calls in parallel; routes answer in < 1 s
      MemorySize: 1024  # mask decoding and base64 of 6 photos are CPU-bound
      LoggingConfig: { LogGroup: !Ref ApiLogGroup }
      Environment:
        Variables:
          MODEL_API_KEY_PARAM: /climateguard/meta-model-api-key
          USE_CONTRIBUTOR: "false"  # real photos: never contributor mode
      EventInvokeConfig:
        MaximumRetryAttempts: 0  # a failed analysis shows "try again" rather than running (and billing) twice
      Policies:
        - S3CrudPolicy: { BucketName: !Ref RecoveryBucket }
        - DynamoDBCrudPolicy: { TableName: !Ref RateLimitTable }
        - DynamoDBCrudPolicy: { TableName: !Ref UsageTable }   # cost log + daily budget
        - DynamoDBCrudPolicy: { TableName: !Ref CacheTable }
        - SSMParameterReadPolicy: { ParameterName: climateguard/meta-model-api-key }
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:climateguard-recovery
      Events:
        Create:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /recovery }
        Photo:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: "/recovery/{job}/photos" }
        Analyze:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: "/recovery/{job}/analyze" }
        Answers:  # starts the report (async, like analyze)
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: "/recovery/{job}/answers" }
        Status:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: "/recovery/{job}" }
        Delete:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: "/recovery/{job}" }

Outputs:
  ApiUrl:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
