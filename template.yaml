AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  ClimateGuard backend (us-east-2; the account's SCP denies other regions). Deploy with `sam build`
  then `.\deploy.ps1`, which runs a permission preflight first. API keys live in SSM Parameter Store.

Parameters:
  FrontendUrl:
    Type: String
    Description: >-
      Public URL of the frontend (CORS origin and links in alert emails), no trailing slash.
      Use http://localhost:5173 until the Vercel app exists, then redeploy with the real URL.
  MaxSubscribers:
    Type: Number
    Default: 500
  NwsUserAgent:
    Type: String
    Description: NWS asks for a User-Agent with contact info, e.g. "ClimateGuard/0.1 you@example.com"

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    CodeUri: backend/src/
    MemorySize: 256
    Environment:
      Variables:
        STORAGE: dynamodb
        SNAPSHOTS_TABLE: !Ref SnapshotsTable
        USAGE_TABLE: !Ref UsageTable
        CACHE_TABLE: !Ref CacheTable
        ALERTS_TABLE: !Ref AlertsTable
        RATELIMIT_TABLE: !Ref RateLimitTable
        NOTIFY_MODE: sns
        FRONTEND_URL: !Ref FrontendUrl
        MAX_SUBSCRIBERS: !Ref MaxSubscribers
        CG_LOCAL_DIR: /tmp/climateguard
        NWS_USER_AGENT: !Ref NwsUserAgent

Resources:
  SnapshotsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: climateguard-snapshots
      BillingMode: PROVISIONED  # free tier: 25 RCU / 25 WCU total across tables
      ProvisionedThroughput: { ReadCapacityUnits: 5, WriteCapacityUnits: 5 }
      AttributeDefinitions:
        - { AttributeName: city, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: city, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }

  # Model usage + estimated cost per call (scripts/spend.py reads it with STORAGE=dynamodb)
  UsageTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: climateguard-usage
      BillingMode: PROVISIONED
      ProvisionedThroughput: { ReadCapacityUnits: 2, WriteCapacityUnits: 2 }
      AttributeDefinitions:
        - { AttributeName: day, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: day, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }

  # Model response cache; DynamoDB TTL removes expired items
  CacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: climateguard-cache
      BillingMode: PROVISIONED
      ProvisionedThroughput: { ReadCapacityUnits: 2, WriteCapacityUnits: 2 }
      AttributeDefinitions:
        - { AttributeName: key, AttributeType: S }
      KeySchema:
        - { AttributeName: key, KeyType: HASH }
      TimeToLiveSpecification: { AttributeName: expires_at, Enabled: true }

  # Sent alerts (dedup) + monitoring agent decision log
  AlertsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: climateguard-alerts
      BillingMode: PROVISIONED
      ProvisionedThroughput: { ReadCapacityUnits: 2, WriteCapacityUnits: 2 }
      AttributeDefinitions:
        - { AttributeName: city, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: city, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }

  # Per-IP / per-email sign-up limits, "already subscribed" markers, subscriber counter
  RateLimitTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: climateguard-ratelimit
      BillingMode: PROVISIONED
      ProvisionedThroughput: { ReadCapacityUnits: 2, WriteCapacityUnits: 2 }
      AttributeDefinitions:
        - { AttributeName: k, AttributeType: S }
      KeySchema:
        - { AttributeName: k, KeyType: HASH }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }

  # 7-day retention keeps logs well inside the free 5 GB (Lambda's default groups never expire)
  CollectLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /climateguard/collect
      RetentionInDays: 7

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /climateguard/api
      RetentionInDays: 7

  CollectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: climateguard.handlers.collect.handler
      # Collection ~6 s; each agent run ~10-20 s, and only for cities whose data changed
      Timeout: 300
      LoggingConfig: { LogGroup: !Ref CollectLogGroup }
      Environment:
        Variables:
          # SecureStrings created by hand (CloudFormation can't create them); see README "Deploy".
          # The code reads BASETEN_API_KEY / AIRNOW_API_KEY env vars first, then these parameters.
          BASETEN_API_KEY_PARAM: /climateguard/baseten-api-key
          AIRNOW_API_KEY_PARAM: /climateguard/airnow-api-key  # if missing: Open-Meteo modeled AQI
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref SnapshotsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref UsageTable }
        - DynamoDBCrudPolicy: { TableName: !Ref CacheTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AlertsTable }
        # Decryption uses the AWS-managed aws/ssm key, whose key policy already allows SSM callers
        - SSMParameterReadPolicy: { ParameterName: climateguard/baseten-api-key }
        - SSMParameterReadPolicy: { ParameterName: climateguard/airnow-api-key }
        - Statement:
            - Effect: Allow
              Action: [sns:CreateTopic, sns:Publish, sns:TagResource]
              Resource: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:climateguard-*
      Events:
        Every15Min:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(15 minutes)

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref FrontendUrl, "http://localhost:5173"]
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [Content-Type]
      DefaultRouteSettings:  # whole-API safety net; per-IP limits are enforced in code
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: climateguard.handlers.api.handler
      Timeout: 10
      LoggingConfig: { LogGroup: !Ref ApiLogGroup }
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref SnapshotsTable }
        - DynamoDBReadPolicy: { TableName: !Ref AlertsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref RateLimitTable }
        - Statement:
            - Effect: Allow
              Action: [sns:CreateTopic, sns:Subscribe, sns:TagResource]
              Resource: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:climateguard-*
      Events:
        ListCities:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /cities }
        GetCity:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /cities/{city}
        GetCityAlerts:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /cities/{city}/alerts
        Subscribe:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /subscribe }

Outputs:
  ApiUrl:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
